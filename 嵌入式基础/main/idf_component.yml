## main 组件的依赖声明（ESP-IDF 组件管理器 idf_component.yml）
##
## 本工程目前依赖的全部是 ESP-IDF 自带组件（driver / esp_wifi / esp_http_server /
## nvs_flash / esp_netif / esp_event / esp_timer），无需从组件注册表下载任何东西，
## 因此这里只声明 IDF 版本要求，保证离线也能构建。
