<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FinalWork · TASK4 无线点灯</title>
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --line:#2b323c;
    --fg:#e6edf3; --dim:#8b949e; --accent:#ffb02e; --ok:#3fb950; --bad:#f85149;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:20px;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#1b2330,#0d1117 60%);
    color:var(--fg);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
  }
  .wrap{width:100%;max-width:420px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .sub{font-size:12px;color:var(--dim)}
  .bulb{
    width:46px;height:46px;border-radius:50%;flex:none;
    background:#232a35;box-shadow:inset 0 0 12px #000;transition:.25s;
    display:grid;place-items:center;font-size:22px;
  }
  .bulb.on{background:radial-gradient(circle at 35% 30%,#fff6d8,var(--accent));
           box-shadow:0 0 26px rgba(255,176,46,.75)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
  .big small{font-size:16px;color:var(--dim);font-weight:400}
  .switch{
    width:74px;height:40px;border-radius:999px;background:#30363d;border:1px solid var(--line);
    position:relative;cursor:pointer;transition:.2s;flex:none;
  }
  .switch::after{
    content:"";position:absolute;top:3px;left:3px;width:32px;height:32px;border-radius:50%;
    background:#8b949e;transition:.2s;
  }
  .switch.on{background:rgba(255,176,46,.25);border-color:var(--accent)}
  .switch.on::after{left:37px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:38px;background:transparent;margin:10px 0 0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:#30363d}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--accent);
    margin-top:-11px;border:3px solid #0d1117;box-shadow:0 0 10px rgba(255,176,46,.6);
  }
  input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:#30363d}
  input[type=range]::-moz-range-thumb{width:26px;height:26px;border:3px solid #0d1117;border-radius:50%;background:var(--accent)}
  .btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
  button{
    font:inherit;font-size:14px;padding:11px 6px;border-radius:10px;cursor:pointer;
    background:#21262d;color:var(--fg);border:1px solid var(--line);transition:.15s;
  }
  button:active{transform:scale(.97);background:#30363d}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;color:var(--dim)}
  .kv b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--bad);display:inline-block;margin-right:6px}
  .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  footer{font-size:11px;color:#586069;text-align:center;line-height:1.7}
  .flash{animation:fl .4s}
  @keyframes fl{from{opacity:.35}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div id="bulb" class="bulb">💡</div>
    <div>
      <h1>FinalWork · 无线点灯</h1>
      <div class="sub">TASK4 · Wi-Fi STA + esp_http_server</div>
    </div>
  </header>

  <div class="card">
    <div class="row">
      <div>
        <div class="big"><span id="pct">--</span><small>%</small></div>
        <div class="sub" id="stateText" style="font-size:12px;color:var(--dim)">读取中…</div>
      </div>
      <div id="sw" class="switch"></div>
    </div>

    <input id="slider" type="range" min="0" max="100" step="1" value="0">

    <div class="btns">
      <button data-set="0">熄灭</button>
      <button data-set="50">50%</button>
      <button data-set="100">最亮</button>
    </div>
  </div>

  <div class="card">
    <div class="kv"><span><span id="dot" class="dot"></span>Wi-Fi 状态</span><b id="conn">--</b></div>
    <div class="kv"><span>开发板 IP</span><b id="ip">--</b></div>
    <div class="kv"><span>信号强度 (RSSI)</span><b id="rssi">--</b></div>
    <div class="kv"><span>最近更新</span><b id="tick">--</b></div>
  </div>

  <footer>
    网页内嵌在固件里（CMakeLists 的 EMBED_FILES），不依赖文件系统<br>
    API：GET /api/led · POST /api/led {"brightness":0~100} · POST /api/led/toggle<br>
    手动调光会自动结束呼吸灯效果
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const slider = $('slider');
let dragging = false;

/* 拖动滑条：本地即时反馈 + 请求板子 */
slider.addEventListener('input', () => {
  dragging = true;
  $('pct').textContent = slider.value;
});
slider.addEventListener('change', () => {
  setBrightness(+slider.value);
  setTimeout(() => dragging = false, 900);   // 之后恢复自动刷新
});
/* 手机上拖动结束后可能不触发 change */
slider.addEventListener('touchend', () => {
  setBrightness(+slider.value);
  setTimeout(() => dragging = false, 900);
});

$('sw').addEventListener('click', () => post('/api/led/toggle'));
document.querySelectorAll('button[data-set]').forEach(b => {
  b.addEventListener('click', () => setBrightness(+b.dataset.set));
});

async function setBrightness(v) {
  $('pct').textContent = v;
  await post('/api/led', { brightness: v });
}

async function post(url, body) {
  try {
    const r = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : '{}'
    });
    render(await r.json());
  } catch (e) {
    $('stateText').textContent = '请求失败：' + e;
  }
}

async function poll() {
  try {
    const r = await fetch('/api/led', { cache: 'no-store' });
    render(await r.json());
  } catch (e) { /* 网络抖动，下一次轮询再试 */ }
}

function render(s) {
  $('pct').textContent = s.brightness;
  if (!dragging) slider.value = s.brightness;

  const on = s.on;
  $('sw').classList.toggle('on', on);
  $('bulb').classList.toggle('on', on);
  $('bulb').classList.add('flash');
  setTimeout(() => $('bulb').classList.remove('flash'), 400);
  $('stateText').textContent = on ? '点亮中 · ' + s.brightness + '%' : '已熄灭';

  $('ip').textContent   = s.ip || '--';
  $('rssi').textContent = (s.rssi ? s.rssi + ' dBm' : '--');
  $('conn').textContent = s.connected ? '已连接' : '未连接';
  $('dot').classList.toggle('ok', !!s.connected);
  $('tick').textContent = new Date().toLocaleTimeString();
}

poll();
setInterval(poll, 2000);   // 2 秒轮询一次，别的客户端改了状态这里也能跟上
</script>
</body>
</html>
